name: Blue Green Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e
    
          cd /var/www/project/rivan_practice_web
    
          git fetch origin
          git reset --hard origin/main
    
          docker network inspect prod_network >/dev/null 2>&1 || docker network create prod_network
    
          ACTIVE=$(cat .active_color)
    
          if [ "$ACTIVE" = "blue" ]; then
            NEW="green"
            OLD="blue"
          else
            NEW="blue"
            OLD="green"
          fi
    
          echo "Deploying to $NEW environment..."
    
          docker compose -f docker-compose.prod.yml up -d --build backend_$NEW frontend_$NEW
    
          echo "Performing health check..."
    
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health/)
    
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              break
            fi
    
            sleep 3
          done
    
          if [ "$STATUS" != "200" ]; then
            echo "Deployment failed. Rolling back."
            docker compose -f docker-compose.prod.yml stop backend_$NEW frontend_$NEW
            exit 1
          fi
    
          echo "Switching nginx upstream..."
    
          cat > nginx/upstream.conf <<EOF
          upstream backend_upstream {
              server backend_$NEW:8000;
          }
          
          upstream frontend_upstream {
              server frontend_$NEW:5173;
          }
          EOF
    
          docker exec prod_nginx nginx -t
          docker exec prod_nginx nginx -s reload
    
          echo "$NEW" > .active_color
    
          docker compose -f docker-compose.prod.yml stop backend_$OLD frontend_$OLD
    
          echo "Deployment complete."

